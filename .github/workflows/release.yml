name: release

# Release estable por tag v* (desde v1.0.0 el runtime es Go).
#
# Publica, por arquitectura, el BINARIO del backend Go
# (`helios_<ver>_linux_<arch>`), estático y autocontenido: la UI templ y los
# estáticos raíz (favicon, manifest, sw.js) van embebidos, así que ya no hay
# tarball de frontend.
# El checksums.txt se genera en un job `release` SEPARADO (needs: build) que
# combina AMBAS arquitecturas: si cada job de la matriz subiera el suyo, el
# último pisaría al otro (bug real ya visto en el port de deltos #36).
#
# El 'Comprobar actualizaciones' del front consume releases/latest (semver) y
# deploy/helios-update.sh descarga el binario + la web del tag publicado.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # sin tag = compila y sube como artifact de prueba

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum

      - name: Instala templ CLI
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1070

      - name: Verifica artefactos web al día (templ + css)
        run: make web-check TEMPL="$(go env GOPATH)/bin/templ"

      - name: Tests del backend Go
        working-directory: server-go
        run: |
          go vet ./...
          go test -race ./...

      - name: Compila el binario (estático, sin CGO)
        working-directory: server-go
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          # El tag llega por entorno para que un nombre de ref no inyecte shell.
          REF="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "ERROR: el tag '$REF' no tiene el formato vX.Y.Z" >&2
              exit 1
            }
            VERSION="${REF#v}"
          else
            VERSION="0.0.0-SNAPSHOT-${GITHUB_SHA::7}"
          fi
          go build -trimpath -ldflags="-s -w -X helios-server/internal/version.Version=${VERSION}" \
            -o "../helios_${VERSION}_linux_${{ matrix.arch }}" ./cmd/server
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Comprueba el artefacto
        run: ls -la helios_*

      - name: Sube artifacts (binario por arch)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helios-${{ matrix.arch }}
          # Globs: upload-artifact no expande variables de shell en `path`.
          path: |
            helios_*_linux_${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Descarga artifacts de ambas arquitecturas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: helios-*
          merge-multiple: true
          path: dist

      - name: Genera checksums.txt combinado
        working-directory: dist
        run: |
          chmod +x helios_*_linux_* 2>/dev/null || true
          sha256sum helios_*_linux_* > checksums.txt
          cat checksums.txt

      - name: Publica en la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/helios_*_linux_*
            dist/checksums.txt
