name: release

# Release estable por tag v* (desde v1.0.0 el runtime es Go).
#
# Publica, por arquitectura:
#   - el BINARIO del backend Go (`helios_<ver>_linux_<arch>`), estático
#   - el tarball del frontend ya construido (`helios-web_<ver>_linux_<arch>.tar.gz`)
# El checksums.txt se genera en un job `release` SEPARADO (needs: build) que
# combina AMBAS arquitecturas: si cada job de la matriz subiera el suyo, el
# último pisaría al otro (bug real ya visto en el port de deltos #36).
#
# El 'Comprobar actualizaciones' del front consume releases/latest (semver) y
# deploy/helios-update.sh descarga el binario + la web del tag publicado.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # sin tag = compila y sube como artifact de prueba

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tests del backend Go
        working-directory: server-go
        run: |
          go vet ./...
          go test -race ./...

      - name: Build frontend
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Compila el binario (estático, sin CGO)
        working-directory: server-go
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          REF="${{ github.ref_name }}"
          VERSION="${REF#v}"
          [ "${{ github.ref_type }}" = "tag" ] || VERSION="0.0.0-SNAPSHOT-${GITHUB_SHA::7}"
          go build -trimpath -ldflags="-s -w -X main.appVersion=${VERSION}" \
            -o "../helios_${VERSION}_linux_${{ matrix.arch }}" ./cmd/server
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Empaqueta el frontend
        run: |
          mkdir -p stage
          cp -r app/dist stage/dist
          tar -czf "helios-web_${VERSION}_linux_${{ matrix.arch }}.tar.gz" -C stage .
          ls -la helios_*

      - name: Sube artifacts (binario + web por arch)
        uses: actions/upload-artifact@v4
        with:
          name: helios-${{ matrix.arch }}
          path: |
            helios_${VERSION}_linux_${{ matrix.arch }}
            helios-web_${VERSION}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Descarga artifacts de ambas arquitecturas
        uses: actions/download-artifact@v4
        with:
          pattern: helios-*
          merge-multiple: true
          path: dist

      - name: Genera checksums.txt combinado
        working-directory: dist
        run: |
          chmod +x helios_*_linux_* 2>/dev/null || true
          sha256sum helios_* > checksums.txt
          cat checksums.txt

      - name: Publica en la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/helios_*
            dist/checksums.txt
