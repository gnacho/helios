name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Descarga Tailwind standalone (sin node)
        run: make tools/tailwindcss
      - name: Instala templ CLI
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1070
      - name: Verifica artefactos web al día (templ + css)
        run: make web-check TEMPL="$(go env GOPATH)/bin/templ"
      - run: go vet ./...
        working-directory: server-go
      - run: go test -race ./...
        working-directory: server-go
      - run: go build ./...
        working-directory: server-go

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: landing
      - name: Verifica que el build no deja cambios sin commitear
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "ERROR: el build de la landing dejó cambios sin commitear" >&2
            exit 1
          }

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          ver=8.30.1
          url="https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL --max-time 120 --max-filesize 104857600 -o "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/gitleaks_checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_checksums.txt"
          expected="$(awk '$2 == "gitleaks_'"${ver}"'_linux_x64.tar.gz" { print $1 }' "$RUNNER_TEMP/gitleaks_checksums.txt")"
          [ -n "$expected" ]
          echo "${expected}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks
      - name: Escanear secretos en todo el historial
        run: gitleaks git . --redact --no-banner
