name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Descarga Tailwind standalone (sin node)
        run: make tools/tailwindcss
      - name: Instala templ CLI
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1070
      - name: Verifica artefactos web al día (templ + css + i18n)
        run: make web-check TEMPL="$(go env GOPATH)/bin/templ"
      - run: go vet ./...
        working-directory: server-go
      - run: go test -race ./...
        working-directory: server-go
      - run: go build ./...
        working-directory: server-go

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm run check:bundlesize
        working-directory: app
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: landing

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Compila el binario del backend
        working-directory: server-go
        run: |
          CGO_ENABLED=0 go build -o ../helios-go ./cmd/server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar xz -C /usr/local/bin gitleaks
      - name: Escanear secretos en todo el historial
        run: gitleaks git . --redact --no-banner
