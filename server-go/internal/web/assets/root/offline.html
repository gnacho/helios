<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Helios · sin conexión</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f4f6fa; color: #0f1729;
    font-family: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  }
  main { max-width: 22rem; padding: 2rem; text-align: center; }
  h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
  p { margin: 0 0 1.25rem; font-size: .875rem; line-height: 1.5; color: #5b6478; }
  button {
    padding: .55rem 1.1rem; border-radius: .75rem; border: 1px solid #d6dbe6;
    background: #fff; color: inherit; font: inherit; font-weight: 600; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #080d1a; color: #e8edf7; }
    p { color: #94a3b8; }
    button { background: #0f1729; border-color: #1e293b; }
  }
</style>
</head>
<body>
<main>
  <h1>Sin conexión / Offline</h1>
  <p>Helios no puede hablar con el servidor ahora mismo. Se mostrará la última página guardada en cuanto vuelva la red.</p>
  <button type="button" onclick="location.reload()">Reintentar / Retry</button>
</main>
</body>
</html>
