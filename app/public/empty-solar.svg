      <line x1="158" y1="251" x2="194" y2="299"/>
      <line x1="112" y1="286" x2="204" y2="262"/>
    </g>
    <line x1="160" y1="310" x2="160" y2="330" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g>
    <path d="M206 256 L298 232 L334 280 L242 304 Z" fill="url(#panel-g)"/>
    <g stroke="#3B5BA9" stroke-width="2" opacity="0.9">
