  </defs>
  <!-- sun rays -->
  <g stroke="#F59E0B" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="205" y1="52" x2="205" y2="76"/>
    <line x1="138" y1="80" x2="155" y2="97"/>
    <line x1="272" y1="80" x2="255" y2="97"/>
    <line x1="118" y1="140" x2="142" y2="140"/>
    <line x1="292" y1="140" x2="268" y2="140"/>
  </g>
  <!-- smiling sun -->
  <circle cx="205" cy="150" r="62" fill="url(#sun-g)"/>
  <circle cx="184" cy="140" r="6" fill="#7C2D12"/>
  <circle cx="226" cy="140" r="6" fill="#7C2D12"/>
  <path d="M184 166 Q205 182 226 166" stroke="#7C2D12" stroke-width="6" stroke-linecap="round" fill="none"/>
